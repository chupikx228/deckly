name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  frontend:
    name: Frontend & packages (strict)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: No JavaScript in source (TypeScript-only rule)
        run: |
          matches=$(git ls-files \
            'apps/*/src/**/*.js' 'apps/*/src/**/*.jsx' \
            'packages/*/src/**/*.js' 'packages/*/src/**/*.jsx')
          if [ -n "$matches" ]; then
            echo "::error::JavaScript files found in source. This repo is TypeScript-only."
            echo "$matches"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (incl. OpenAPI/Zod contract assertions)
        run: pnpm typecheck

      - name: Lint (FSD boundaries + strict TS + complexity)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Test
        run: pnpm test

  contract:
    name: API contract (OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI spec
        run: pnpm api:lint
      - name: Verify generated types are in sync with the spec
        run: |
          pnpm api:generate
          if ! git diff --quiet -- packages/api-contract/src/generated; then
            echo "::error::Generated API types are stale. Run 'pnpm api:generate' and commit."
            git diff -- packages/api-contract/src/generated
            exit 1
          fi

  backend:
    name: Backend (format, lint, mypy strict, import-linter, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: make install

      - name: Check (format + lint + mypy strict + import-linter)
        run: make check

      - name: Test
        run: make test
