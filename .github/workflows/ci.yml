name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  frontend:
    name: Frontend & packages (strict)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: No JavaScript in source (TypeScript-only rule)
        run: |
          matches=$(git ls-files \
            'apps/*/src/**/*.js' 'apps/*/src/**/*.jsx' \
            'packages/*/src/**/*.js' 'packages/*/src/**/*.jsx')
          if [ -n "$matches" ]; then
            echo "::error::JavaScript files found in source. This repo is TypeScript-only."
            echo "$matches"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (incl. OpenAPI/Zod contract assertions)
        run: pnpm typecheck

      - name: Lint (FSD boundaries + strict TS + complexity)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Test
        run: pnpm test

  contract:
    name: API contract (OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI spec
        run: pnpm api:lint
      - name: Verify generated types are in sync with the spec
        run: |
          pnpm api:generate
          if ! git diff --quiet -- packages/api-contract/src/generated; then
            echo "::error::Generated API types are stale. Run 'pnpm api:generate' and commit."
            git diff -- packages/api-contract/src/generated
            exit 1
          fi

  backend:
    name: Backend (format, lint, mypy strict, import-linter, dead code, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deckly
          POSTGRES_PASSWORD: deckly
          POSTGRES_DB: deckly
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U deckly -d deckly"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: make install

      - name: Check (suppression guard + format + lint incl. complexity budget + mypy strict + import-linter + dead code)
        run: make check

      - name: Test (unit, contract; starts the coverage data)
        run: make test

      - name: Configure environment
        run: cp .env.example .env

      - name: Migrate
        run: make migrate

      - name: Integration test (Postgres + Redis; appends to the coverage data)
        run: make test-integration

      - name: Coverage floors (overall, domain + application, adapters)
        run: make coverage-gate

  backend-audit:
    name: Backend dependency audit (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Audit locked dependencies for known vulnerabilities
        run: make audit

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the repository history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'
