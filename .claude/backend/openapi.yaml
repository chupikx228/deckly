openapi: 3.1.0

info:
  title: Deckly Generation API
  version: 1.0.0
  description: >
    Generation API for the Deckly mobile app. The app is offline-first: local SQLite owns
    all user data and scheduling runs on the device. This API exists only to turn a topic, or a
    document the client uploaded, into a set of reviewable notes. There are deliberately no deck,
    review, auth or sync endpoints in v1. Documents uploaded as generation input are short-lived:
    an upload nothing uses is deleted after 24 hours, and one a generation used is deleted once
    the last job that used it is.

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Local development

tags:
  - name: generations
    description: Asynchronous deck generation jobs
  - name: notes
    description: Single-note operations
  - name: documents
    description: Source documents and recordings uploaded as generation input
  - name: system

paths:
  /generations:
    post:
      tags: [generations]
      operationId: createGeneration
      summary: Start a deck generation job
      description: >
        A job generates either from a topic, researched on the web, or from a document the same
        X-Client-Id uploaded with POST /documents, named by its documentId; a request carries
        exactly one of the two. A documentId that is unknown, belongs to another client, is still
        being uploaded or has expired is 404 DOCUMENT_NOT_FOUND, checked before the quota is used.
        The request is screened against the content policy (the topic, or the document's file
        name, together with the instructions) and one that violates it is 422 TOPIC_REJECTED. A
        document's text is screened again by the worker before any card is written from it; a
        document that violates the policy fails the job with DOCUMENT_REJECTED. A documentId that
        names an audio or video recording uploaded with POST /recordings is 422
        DOCUMENT_NOT_SUPPORTED_FOR_GENERATION until transcription exists (DEC-86), refused before
        the quota is used.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationRequest'
      responses:
        '202':
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /generations/{jobId}:
    get:
      tags: [generations]
      operationId: getGeneration
      summary: Poll a generation job
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: >
            Current job state. A failed generation is reported here with status "failed",
            not as an HTTP error. A job that stops making progress is failed by the server with
            GENERATION_FAILED instead of being left queued or running. A job is deleted once
            it has been finished for 24 hours, and polling it after that returns 404
            JOB_NOT_FOUND.
          headers:
            Retry-After:
              description: Seconds to wait before polling again. Sent while non-terminal.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /generations/{jobId}/cancel:
    post:
      tags: [generations]
      operationId: cancelGeneration
      summary: Cancel a running job
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '204':
          description: Cancellation accepted
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'

  /notes/regenerate:
    post:
      tags: [notes]
      operationId: regenerateNote
      summary: Regenerate a single rejected note
      description: >
        Synchronous and cheap. Must respond within 10 seconds. Runs its own small source search, so the
        replacement note is sourced like any generated note. Rate limited per X-Client-Id separately
        from the generation job quota (429 RATE_LIMITED). The topic and the rejected note are screened
        together against the content policy, and a request that violates it is 422 TOPIC_REJECTED. A
        503 is UPSTREAM_UNAVAILABLE when a provider or the content check is down, slow, rejects the
        request or answers with malformed data, or NO_VALID_CONTENT when no note that passes
        validation and the content check could be produced. A note of a deck generated from an
        uploaded document cannot be regenerated in v1: a request that names a documentId is 422
        DOCUMENT_REGENERATION_UNSUPPORTED, refused before the regeneration budget is touched and
        before any search or document read (DEC-83).
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateNoteRequest'
      responses:
        '200':
          description: A replacement note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedNote'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /documents:
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Upload a PDF or PowerPoint document
      description: >
        Stores one PDF or PowerPoint (.pptx) file so a later request can refer to it by its
        documentId. The type is decided from the file's content, never from its name or the
        declared Content-Type, so a renamed file of another type is 415 UNSUPPORTED_DOCUMENT_TYPE,
        as are legacy .ppt, macro-enabled .pptm, password-protected and damaged files. A file over
        the size limit (25 MiB by default) is 413 DOCUMENT_TOO_LARGE and is refused before it is
        stored. Uploads are rate limited per X-Client-Id and per network address, separately from
        the generation quota (429 RATE_LIMITED). A document nothing uses expires 24 hours after it
        was uploaded, and reading it afterwards is 404 DOCUMENT_NOT_FOUND. A document a generation
        job used stays readable for as long as that job can be polled. There is no
        Idempotency-Key: retrying an upload stores a second copy, which expires the same way. The
        server also bounds how many uploads it handles at once; one that arrives while every slot
        is taken is refused at once as 503 UPSTREAM_UNAVAILABLE with Retry-After, before it is
        counted against the upload budget, and can simply be retried.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '201':
          description: The document was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /recordings:
    post:
      tags: [documents]
      operationId: uploadRecording
      summary: Upload an audio or video recording
      description: >
        Stores one MP3, M4A, WAV, MP4 or MOV file so a later request can refer to it by its
        documentId, like an uploaded document (it is read with GET /documents/{documentId} and
        expires the same way). The type is decided from the file's content, never from its name or
        the declared Content-Type, so a renamed file of another type is 415
        UNSUPPORTED_DOCUMENT_TYPE, as are video files without an audio track, fragmented MP4,
        encrypted (DRM) audio, images in an MP4-family container (HEIC, AVIF), and damaged or
        truncated files. The duration is read from the container's own metadata, never by decoding
        the audio, and a recording longer than the limit (15 minutes by default) is 422
        RECORDING_TOO_LONG. A file over the size limit (48 MiB by default) is 413
        DOCUMENT_TOO_LARGE and is refused before it is stored. Uploads share the document upload
        budget (429 RATE_LIMITED) and have their own concurrency limit (503 UPSTREAM_UNAVAILABLE
        with Retry-After when every slot is taken). Generating from a recording is not supported
        yet: POST /generations answers 422 DOCUMENT_NOT_SUPPORTED_FOR_GENERATION.
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
      responses:
        '201':
          description: The recording was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /documents/{documentId}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Read an uploaded document's metadata
      description: >
        Returns what was stored, never the file itself. Only the X-Client-Id that uploaded the
        document can read it; any other client gets 404 DOCUMENT_NOT_FOUND, exactly as for a
        document that never existed or has expired.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: The document's metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'

  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service health
      parameters:
        - name: X-Client-Id
          in: header
          required: false
          description: >
            Optional here. When supplied, the response includes this client's current
            generation quota, so the app can show the remaining budget before the wizard.
            Same format as the required X-Client-Id header; a malformed value is rejected
            with 400 VALIDATION_FAILED rather than ignored.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      responses:
        '200':
          description: >
            The service answered. status is "degraded" when Postgres or Redis did not answer
            in time; the client should treat that like being offline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/Problem'

components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-generated version 4 UUID in canonical form: lowercase, hyphenated, no braces or
        urn:uuid: prefix. The nil UUID and other versions are rejected. Replaying the same
        request body with the same key returns the original job instead of starting a second
        one. Reusing the key with a different body returns 409 IDEMPOTENCY_KEY_CONFLICT. Bodies
        are compared after defaults are applied and the topic is trimmed, so key order and
        explicitly sent defaults do not matter. A key is honoured for 24 hours after the
        original request; after that the same key starts a new job, and the original job can
        still be polled until it is deleted.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

    ClientId:
      name: X-Client-Id
      in: header
      required: true
      description: >
        Anonymous device identifier, used for rate limiting. Version 4 UUID in canonical form
        only: lowercase, hyphenated, no braces or urn:uuid: prefix. The nil UUID and other
        versions are rejected.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    NoteType:
      type: string
      enum:
        - basic
        - basic_reversed
        - basic_optional_reversed
        - basic_type_in
        - cloze
        - multiple_choice
        - image_occlusion

    Difficulty:
      type: string
      enum: [beginner, intermediate, advanced]

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    JobStage:
      type: string
      enum:
        - planning
        - retrieving_sources
        - parsing_sources
        - generating_cards
        - fetching_media
        - finalizing

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - TOPIC_REJECTED
        - RATE_LIMITED
        - JOB_NOT_FOUND
        - JOB_ALREADY_TERMINAL
        - IDEMPOTENCY_KEY_CONFLICT
        - PROVIDER_UNAVAILABLE
        - NO_VALID_CONTENT
        - GENERATION_FAILED
        - DOCUMENT_UNREADABLE
        - DOCUMENT_ENCRYPTED
        - DOCUMENT_HAS_NO_TEXT
        - DOCUMENT_REJECTED
        - DOCUMENT_REGENERATION_UNSUPPORTED
        - DOCUMENT_NOT_SUPPORTED_FOR_GENERATION
        - UPSTREAM_UNAVAILABLE
        - DOCUMENT_NOT_FOUND
        - DOCUMENT_TOO_LARGE
        - UNSUPPORTED_DOCUMENT_TYPE
        - RECORDING_TOO_LONG
        - ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - INTERNAL_ERROR

    DocumentContentType:
      type: string
      description: The type detected from the file's content.
      enum:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - audio/mpeg
        - audio/mp4
        - audio/wav
        - video/mp4
        - video/quicktime

    DocumentUploadRequest:
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
          description: >
            The document or recording, as the only part of the form. Its filename is kept for
            display, cut to its last path component and 255 characters, with control and invisible
            characters removed; a name with nothing left is 400 VALIDATION_FAILED.

    Document:
      type: object
      required: [documentId, filename, sizeBytes, contentType, uploadedAt]
      additionalProperties: false
      properties:
        documentId:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
        sizeBytes:
          type: integer
          minimum: 1
        contentType:
          $ref: '#/components/schemas/DocumentContentType'
        uploadedAt:
          type: string
          format: date-time
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          description: >
            Present only for a recording: its length in seconds as its container's metadata gives
            it, never shorter than what a decoder would play.

    RejectionReason:
      type: string
      enum: [too_easy, too_hard, incorrect, duplicate, off_topic, other]

    GenerationRequest:
      type: object
      required: [language, cardCount]
      additionalProperties: false
      description: >
        Exactly one of topic and documentId: a request with both, or with neither, is
        VALIDATION_FAILED, and so is either one sent as null. image_occlusion is not generated
        yet, so a request whose noteTypes contains it is rejected with VALIDATION_FAILED whatever
        includeImages says. Once it is generated, it will also need includeImages: true, because
        an image-occlusion note is built on an image the server fetches; the if/then below
        already rejects it without images, and leaving includeImages out counts as false.
      oneOf:
        - required: [topic]
          properties:
            topic:
              type: string
        - required: [documentId]
          properties:
            documentId:
              type: string
      if:
        required: [noteTypes]
        properties:
          noteTypes:
            contains:
              const: image_occlusion
      then:
        required: [includeImages]
        properties:
          includeImages:
            const: true
      properties:
        topic:
          type: string
          minLength: 3
          maxLength: 200
          description: >
            Length is checked after trimming leading and trailing whitespace, so a blank or
            whitespace-only topic is rejected. The trimmed value is what the server uses.
            The server also requires at least 3 visible characters. Whitespace, control
            characters, format characters such as zero-width space or BOM, combining marks,
            and characters that render blank (Hangul fillers, the blank Braille pattern
            U+2800) do not count toward that minimum, so "a\u200Bb" and "a b" are rejected.
            Must not contain NUL (U+0000).
        documentId:
          type: string
          format: uuid
          description: >
            The documentId POST /documents returned to the same X-Client-Id. Canonical form only:
            a lowercase, hyphenated version 4 UUID. Cards are written from the document's text
            and cite its pages or slides.
        language:
          type: string
          description: >
            BCP 47 tag. The language of the cards, not of the interface. Checked for
            well-formed syntax only, not against the language subtag registry.
          example: ru
        cardCount:
          type: integer
          minimum: 5
          maximum: 200
          description: >
            A target, not a guarantee. Fewer notes may be returned. Must be a plain JSON
            integer literal; 1e2 and 40.0 are rejected.
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        noteTypes:
          type: array
          minItems: 1
          uniqueItems: true
          default: [basic]
          description: >
            A note type the server cannot generate yet is rejected with VALIDATION_FAILED,
            even though it is in the enum. image_occlusion is currently such a type.
          items:
            $ref: '#/components/schemas/NoteType'
        includeImages:
          type: boolean
          default: false
          description: Must be true when noteTypes contains image_occlusion.
        instructions:
          type: string
          maxLength: 500
          description: Must not contain NUL (U+0000).

    GenerationJobCreated:
      type: object
      required: [jobId, status, createdAt]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        createdAt:
          type: string
          format: date-time
        quota:
          $ref: '#/components/schemas/Quota'
          description: This client's generation budget after this job was accepted.

    GenerationJob:
      type: object
      required: [jobId, status, progress, createdAt, updatedAt]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        stage:
          oneOf:
            - $ref: '#/components/schemas/JobStage'
            - type: 'null'
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Monotonic. Must never decrease between polls.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          oneOf:
            - $ref: '#/components/schemas/GenerationResult'
            - type: 'null'
          description: Present only when status is "succeeded".
        error:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
          description: >
            Present only when status is "failed". Its code is always one of
            PROVIDER_UNAVAILABLE (an upstream model or search provider failed), NO_VALID_CONTENT
            (every note was dropped during validation), DOCUMENT_UNREADABLE (an uploaded document is
            damaged or over a safety limit), DOCUMENT_ENCRYPTED (an uploaded PDF needs a password),
            DOCUMENT_HAS_NO_TEXT (an uploaded document has no extractable text, such as a scan),
            DOCUMENT_NOT_FOUND (the uploaded document was gone from storage when the job read it),
            DOCUMENT_REJECTED (the uploaded document's text violates the content policy) or
            GENERATION_FAILED (anything else).

    GenerationResult:
      type: object
      required: [deck, notes]
      properties:
        deck:
          $ref: '#/components/schemas/GeneratedDeck'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedNote'

    GeneratedDeck:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 120
          description: >
            maxLength is counted in UTF-16 code units, not Unicode code points, matching
            JavaScript's String.length. A character outside the Basic Multilingual Plane, such as
            most emoji, counts as 2.
        description:
          type: string
          maxLength: 500
          description: >
            maxLength is counted in UTF-16 code units, not Unicode code points, matching
            JavaScript's String.length. A character outside the Basic Multilingual Plane, such as
            most emoji, counts as 2.
        tags:
          type: array
          items:
            type: string

    GeneratedNote:
      type: object
      required: [clientId, noteType, fields, sources]
      properties:
        clientId:
          type: string
          format: uuid
          description: Unique within a result. The client tracks edits and regenerations by it.
        noteType:
          $ref: '#/components/schemas/NoteType'
        fields:
          type: object
          description: >
            Shape depends on noteType. basic/basic_reversed/basic_type_in: front, back.
            basic_optional_reversed: front, back, addReverse (boolean).
            cloze: text with {{cN::...}} markers, optional extra. multiple_choice: question,
            answer, distractors. image_occlusion: imageId (the mediaId of one of this note's own
            images), regions with unique ordinals that lie entirely within the image, optional
            extra.
          additionalProperties: true
        media:
          type: array
          items:
            $ref: '#/components/schemas/Media'
        sources:
          type: array
          minItems: 1
          description: >
            Never empty. Shown to the user so claims can be verified. A note the server cannot
            source is dropped from the result rather than returned without one.
          items:
            $ref: '#/components/schemas/Source'
        tags:
          type: array
          items:
            type: string

    Media:
      type: object
      required: [mediaId, kind, url, license]
      properties:
        mediaId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [image, audio]
        url:
          type: string
          format: uri
          description: Directly downloadable without auth, valid for at least 24 hours.
        alt:
          type: string
          description: Mandatory for images. Accessibility text and download-failure fallback.
        width:
          type: integer
        height:
          type: integer
        license:
          type: string
          description: >
            Required. Content with no known licence must not be returned. An SPDX identifier:
            CC0-1.0, CC-BY-<version>, CC-BY-SA-<version>, or Public-Domain.
        attribution:
          $ref: '#/components/schemas/Attribution'

    Attribution:
      type: object
      required: [author, title, sourceUrl, licenseUrl]
      description: >
        Present exactly when the licence requires attribution (CC BY, CC BY-SA), absent for CC0 and
        public domain. The client must show it with the image.
      properties:
        author:
          type: string
          description: The credit line, as the author asks to be credited.
        title:
          type: string
          description: The title of the work.
        sourceUrl:
          type: string
          format: uri
          description: The page the work comes from, where its full licence details are given.
        licenseUrl:
          type: string
          format: uri
          description: The licence deed.

    Source:
      description: >
        Where a note's content comes from: a web page, or a page or slide of a document the client
        uploaded. Branch on kind; a client must ignore a source whose kind it does not know.
      oneOf:
        - $ref: '#/components/schemas/WebSource'
        - $ref: '#/components/schemas/DocumentSource'
      discriminator:
        propertyName: kind
        mapping:
          web: '#/components/schemas/WebSource'
          document: '#/components/schemas/DocumentSource'

    WebSource:
      type: object
      required: [kind, title, url]
      properties:
        kind:
          type: string
          const: web
        title:
          type: string
        url:
          type: string
          format: uri
        retrievedAt:
          type: string
          format: date-time

    DocumentSource:
      type: object
      required: [kind, title, documentId, unit, number]
      properties:
        kind:
          type: string
          const: document
        title:
          type: string
          description: The uploaded document's file name.
        documentId:
          type: string
          format: uuid
          description: The documentId returned by POST /documents.
        unit:
          type: string
          enum: [page, slide]
          description: page for a PDF, slide for a presentation.
        number:
          type: integer
          minimum: 1
          description: >
            The 1-based page or slide the material comes from, as the document's own viewer
            numbers it.

    RegenerateNoteRequest:
      type: object
      required: [language, noteType, rejectedNote, reason]
      additionalProperties: false
      description: >
        noteType image_occlusion is rejected with VALIDATION_FAILED, because the note is built on an
        image the request does not carry. Exactly one of topic and documentId: a request with both,
        or with neither, is VALIDATION_FAILED, and so is either one sent as null. A request that
        names a documentId is well formed but always refused with 422
        DOCUMENT_REGENERATION_UNSUPPORTED.
      oneOf:
        - required: [topic]
          properties:
            topic:
              type: string
        - required: [documentId]
          properties:
            documentId:
              type: string
      properties:
        topic:
          type: string
          minLength: 3
          maxLength: 200
        documentId:
          type: string
          format: uuid
          description: >
            The documentId the deck's generation job was created with. It tells the server the
            deck was generated from an uploaded document, whose note cannot be regenerated in v1.
            The server does not look the document up, so an unknown, foreign or expired id gets
            the same 422. Canonical form only: a lowercase, hyphenated version 4 UUID.
        language:
          type: string
        noteType:
          $ref: '#/components/schemas/NoteType'
        rejectedNote:
          type: object
          required: [fields]
          properties:
            fields:
              type: object
              additionalProperties: true
        reason:
          $ref: '#/components/schemas/RejectionReason'

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Not localised. For logs. The client never renders this directly.
        code:
          $ref: '#/components/schemas/ErrorCode'
        retryAfterSeconds:
          type: integer

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        quota:
          $ref: '#/components/schemas/Quota'
          description: Present only when the request carried an X-Client-Id header.

    Quota:
      type: object
      required: [limit, remaining, resetsAt]
      description: A client's generation budget. Counts generation jobs per client, per day.
      properties:
        limit:
          type: integer
          minimum: 0
          description: Jobs allowed in the current window.
        remaining:
          type: integer
          minimum: 0
          description: Jobs left in the current window. Zero means the next request gets 429.
        resetsAt:
          type: string
          format: date-time
          description: When the window resets and remaining returns to limit.
