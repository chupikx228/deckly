name: deckly-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deckly
      POSTGRES_PASSWORD: deckly
      POSTGRES_DB: deckly
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deckly -d deckly"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
