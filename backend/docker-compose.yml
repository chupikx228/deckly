name: deckly-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deckly
      POSTGRES_PASSWORD: deckly
      POSTGRES_DB: deckly
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deckly -d deckly']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  storage:
    image: andrewgaul/s3proxy:4.1.1
    entrypoint: ['sh', '-c']
    command:
      [
        'mkdir -p /data/deckly-documents && exec /usr/bin/dumb-init -- /opt/s3proxy/run-docker-container.sh',
      ]
    environment:
      S3PROXY_AUTHORIZATION: aws-v2-or-v4
      S3PROXY_IDENTITY: deckly
      S3PROXY_CREDENTIAL: deckly-local-storage
    ports:
      - '9100:80'
    volumes:
      - storage-data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['observability']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=2d'
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres-data:
  storage-data:
